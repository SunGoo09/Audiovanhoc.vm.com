<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Audio Test</title></head>
<body>
<div id="log">Testing...</div>
<script>
async function run() {
  const log = (msg) => {
    console.log(msg);
    document.getElementById('log').innerText += "\n" + msg;
  };
  try {
    const res = await fetch("https://vanhoc-3f624-default-rtdb.firebaseio.com/vanhoc12/audios/custom-1791702167446.json");
    const data = await res.json();
    let fullData = "";
    for (let i = 0; i < data.totalChunks; i++) {
      fullData += (data.chunks["c_" + i] || "");
    }
    const parts = fullData.split(',');
    const mimeMatch = parts[0].match(/:(.*?);/);
    const mime = mimeMatch ? mimeMatch[1] : 'audio/mpeg';
    const b64Data = parts[1];
    
    const byteCharacters = atob(b64Data);
    const byteNumbers = new Uint8Array(byteCharacters.length);
    for (let i = 0; i < byteCharacters.length; i++) {
      byteNumbers[i] = byteCharacters.charCodeAt(i);
    }
    const blob = new Blob([byteNumbers], { type: mime });
    const blobUrl = URL.createObjectURL(blob);

    const audio = new Audio();
    audio.src = blobUrl;
    
    await new Promise((resolve, reject) => {
      audio.oncanplay = () => {
        log("[CANPLAY_SUCCESS] Duration: " + audio.duration.toFixed(2) + "s");
        resolve();
      };
      audio.onerror = (e) => {
        log("[AUDIO_ERROR] " + (audio.error ? audio.error.message : 'unknown'));
        reject();
      };
      setTimeout(() => {
        log("[TIMEOUT_10s] audio.readyState: " + audio.readyState + ", networkState: " + audio.networkState);
        resolve();
      }, 8000);
    });
  } catch (err) {
    log("[EXCEPTION] " + err);
  }
}
run();
</script>
</body>
</html>
