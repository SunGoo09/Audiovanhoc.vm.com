<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=web/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VănHọc12 — Đang chuyển hướng...</title>
  <script>
    window.location.replace("web/");
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 32px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      max-width: 420px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 18px;
      border: 3px solid rgba(99,102,241,0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2 style="margin: 0 0 10px; font-size: 1.25rem;">Đang mở VănHọc12...</h2>
    <p style="margin: 0 0 16px; color: #94a3b8; font-size: 0.9rem;">Tự động chuyển hướng đến ứng dụng web.</p>
    <p style="margin: 0; font-size: 0.85rem;">
      <a href="web/">Bấm vào đây nếu trình duyệt không tự chuyển</a>
    </p>
  </div>
</body>
</html>
